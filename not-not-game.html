<html lang="zh-Hant">
<head>

  <title>Not Not 邏輯方向挑戰</title>
  <style>
    :root{--ink:#eff8ff;--muted:#bbcede;--line:rgba(219,240,255,.25);--panel:rgba(5,23,45,.8);--accent:#65d7ff;--safe:env(safe-area-inset-bottom,0px);color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-width:320px;background:#06172b;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:3px}.shell{position:relative;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 16% 18%,var(--world-a),transparent 34%),radial-gradient(circle at 84% 82%,var(--world-b),transparent 37%),linear-gradient(150deg,#06172b,#102d4d 58%,#202c4e);transition:background .35s}.shell:before,.shell:after{content:"";position:absolute;inset:-15%;z-index:0;opacity:.32;pointer-events:none;background-image:linear-gradient(45deg,transparent 45%,rgba(255,255,255,.15) 46% 54%,transparent 55%);background-size:108px 108px;transform:rotate(11deg);animation:drift 25s linear infinite}.shell:after{opacity:.13;background-size:179px 179px;animation-duration:35s;animation-direction:reverse}@keyframes drift{to{background-position:315px 315px}}.app{position:relative;z-index:1;width:min(100%,1080px);min-height:100vh;margin:0 auto;padding:18px 20px calc(24px + var(--safe))}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:11px;min-width:0}.brand-mark{display:grid;place-items:center;width:46px;height:46px;flex:0 0 auto;color:#092039;background:linear-gradient(135deg,#fff,var(--accent));clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);font-size:15px;font-weight:950;letter-spacing:-1px}h1{margin:0;font-size:clamp(21px,4vw,31px)}.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}.home-link,.secondary,.mode-button,select{border:1px solid var(--line);border-radius:11px;background:rgba(4,16,31,.48);color:var(--ink);padding:9px 12px;text-decoration:none}.home-link:hover,.secondary:hover,.mode-button:hover{background:rgba(255,255,255,.12)}.screen[hidden]{display:none}.intro,.result-card{max-width:720px;margin:6vh auto 0;padding:clamp(25px,6vw,48px);border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,rgba(13,42,73,.95),rgba(7,16,35,.86));box-shadow:0 25px 70px rgba(0,0,0,.3);text-align:center}.eyebrow{margin:0 0 11px;color:var(--accent);font-size:13px;font-weight:900;letter-spacing:.13em}.intro h2{margin:0;font-size:clamp(30px,6vw,52px);line-height:1.2}.lead{max-width:570px;margin:17px auto;color:var(--muted);line-height:1.8}.logic-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0}.logic-row span{border:1px solid var(--line);border-radius:999px;padding:7px 11px;background:rgba(255,255,255,.07);font-size:14px;font-weight:800}.logic-row strong{color:var(--accent)}.primary{min-width:180px;border:0;border-radius:13px;padding:13px 19px;color:#08213a;background:linear-gradient(135deg,#fff,var(--accent));box-shadow:0 10px 28px rgba(93,207,255,.3);font-weight:950}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}.world-heading{margin:3vh 0 7px;font-size:clamp(24px,4vw,32px)}.world-note{margin:0 0 15px;color:var(--muted);line-height:1.65}.world-strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(174px,22%);gap:12px;overflow-x:auto;padding:4px 3px 16px;scroll-snap-type:x mandatory;scrollbar-color:var(--accent) transparent}.world-card{position:relative;min-height:154px;overflow:hidden;scroll-snap-align:center;border:1px solid rgba(255,255,255,.17);border-radius:17px;padding:16px;color:#fff;background:linear-gradient(140deg,var(--card-a),var(--card-b));text-align:left;box-shadow:inset 0 1px rgba(255,255,255,.18),0 9px 20px rgba(0,0,0,.22)}.world-card:after{content:"";position:absolute;right:-27px;bottom:-39px;width:104px;height:104px;border:16px solid rgba(255,255,255,.12);transform:rotate(45deg)}.world-card:hover{transform:translateY(-2px)}.world-card[aria-pressed="true"]{border:3px solid #fff;transform:translateY(-3px)}.world-card i,.world-card strong,.world-card small{position:relative;z-index:1;display:block;font-style:normal}.world-card i{margin-bottom:16px;font-size:29px}.world-card strong{font-size:21px}.world-card small{margin-top:5px;opacity:.86;font-size:13px;line-height:1.45}.selected-world{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin:7px 0 13px;padding:17px 19px;border:1px solid var(--line);border-radius:17px;background:var(--panel)}.selected-world h3{margin:0 0 5px;font-size:23px}.selected-world p{margin:0;color:var(--muted);line-height:1.6}.selected-rule{max-width:330px;border-left:3px solid var(--accent);padding-left:12px;color:#e6f8ff;font-size:14px;font-weight:750;line-height:1.6}.mode-settings{display:flex;flex-wrap:wrap;align-items:end;gap:10px 14px;margin:13px 0;padding:13px 15px;border:1px solid var(--line);border-radius:15px;background:rgba(4,18,35,.55)}.mode-settings h3{width:100%;margin:0;font-size:16px}.mode-buttons{display:flex;gap:7px}.mode-button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#06203a;font-weight:900}.speed-label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px}.speed-label select:disabled{opacity:.5}.difficulty-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.difficulty{border:1px solid var(--line);border-radius:16px;padding:17px;color:var(--ink);background:rgba(5,20,40,.68);text-align:left}.difficulty:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}.difficulty b{display:block;color:var(--accent);font-size:25px}.difficulty strong{display:block;margin:4px 0 6px;font-size:19px}.difficulty span{color:var(--muted);font-size:13px;line-height:1.5}.tip{margin:14px 0;padding:12px 14px;border-radius:12px;background:rgba(75,160,225,.14);color:#d2efff;font-size:14px;line-height:1.65}.play-head{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:1vh 0 11px}.world-status{justify-self:end;margin:0;color:var(--accent);font-weight:900;text-align:right}.world-status small{display:block;margin-top:3px;color:var(--muted);font-weight:600}.progress{display:flex;justify-content:center;gap:6px}.progress i{width:8px;height:8px;border:1px solid rgba(255,255,255,.75);transform:rotate(45deg)}.progress i.done{background:#fff}.progress i.current{border-color:var(--accent);background:var(--accent);box-shadow:0 0 11px var(--accent)}.game-info{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:0 0 9px;color:var(--muted);font-size:14px}.lives{color:#ffc0cd;font-weight:900;white-space:nowrap}.timer-track{flex:1;height:9px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.16)}.timer-fill{display:block;width:100%;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),#fff);transition:width .08s linear}.timer-track[hidden]{display:none}.arena{position:relative;min-height:min(61vh,625px);overflow:hidden;border:1px solid var(--line);border-radius:27px;background:linear-gradient(135deg,rgba(255,255,255,.055) 0 1px,transparent 1px),rgba(3,14,29,.62);background-size:34px 34px;touch-action:none;user-select:none;-webkit-user-select:none}.arena:before{content:"";position:absolute;top:50%;left:50%;width:min(69vw,545px);aspect-ratio:1;border:1px solid rgba(147,223,255,.21);border-radius:50%;box-shadow:0 0 80px rgba(94,214,255,.14),inset 0 0 70px rgba(184,124,255,.1);transform:translate(-50%,-50%);pointer-events:none}.arena.good{animation:good .35s ease}.arena.bad{animation:bad .38s ease}@keyframes good{50%{background-color:rgba(48,245,171,.25)}}@keyframes bad{25%,75%{transform:translateX(9px)}50%{background-color:rgba(255,64,105,.27);transform:translateX(-9px)}}.door{position:absolute;z-index:2;display:grid;place-items:center;width:118px;height:108px;border:2px solid rgba(255,255,255,.72);border-radius:17px;color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--door) 88%,#fff),var(--door));box-shadow:inset 0 1px rgba(255,255,255,.38),0 10px 20px rgba(0,0,0,.25),0 0 20px color-mix(in srgb,var(--door) 25%,transparent);font-weight:900}.door:hover{filter:brightness(1.13);transform:var(--move) scale(1.04)}.door.top{top:4%;left:50%;--move:translateX(-50%);transform:translateX(-50%)}.door.bottom{bottom:4%;left:50%;--move:translateX(-50%);transform:translateX(-50%)}.door.left{top:50%;left:4%;--move:translateY(-50%);transform:translateY(-50%)}.door.right{top:50%;right:4%;--move:translateY(-50%);transform:translateY(-50%)}.door .arrow{display:block;font-size:34px;line-height:1;text-shadow:0 1px 5px rgba(0,0,0,.32)}.door .door-color{display:block;margin-top:4px;font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.35)}.door.empty{border-style:dashed;border-color:rgba(255,255,255,.28);color:rgba(255,255,255,.52);background:rgba(16,28,42,.48);box-shadow:none;cursor:not-allowed}.door.empty .arrow{font-size:20px}.task-card{position:absolute;z-index:3;top:50%;left:50%;width:min(70vw,430px);min-height:224px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:23px;overflow:hidden;border:2px solid rgba(255,255,255,.9);border-radius:23px;background:linear-gradient(150deg,rgba(21,49,80,.97),rgba(4,15,31,.97));box-shadow:0 0 0 10px rgba(255,255,255,.04),0 20px 45px rgba(0,0,0,.34);transform:translate(-50%,-50%);text-align:center}.task-card.lie{border-color:#ff8c9c;box-shadow:0 0 0 10px rgba(255,92,120,.08),0 20px 45px rgba(0,0,0,.34)}.task-card.impossible{border-color:#ffdf74}.task-tag{margin:0 0 7px;color:var(--muted);font-size:14px;font-weight:900;letter-spacing:.06em}.task-main{margin:0;font-size:clamp(48px,10vw,79px);font-weight:950;line-height:1.1;letter-spacing:.04em}.task-main.ink{color:var(--ink-color);text-shadow:0 0 18px color-mix(in srgb,var(--ink-color) 54%,transparent)}.task-sub{min-height:25px;margin:12px 0 0;color:#d8eafb;font-size:15px;line-height:1.55}.rule-mark{position:absolute;top:12px;right:13px;color:#ff98a9;font-size:28px;font-weight:900}.stay{position:absolute;z-index:4;bottom:21px;left:50%;min-width:86px;border:2px solid rgba(255,255,255,.77);border-radius:14px;padding:7px 13px;color:#fff;background:rgba(7,24,43,.9);transform:translateX(-50%);font-weight:950}.stay:hover{background:rgba(255,255,255,.16)}.stay small{display:block;color:var(--muted);font-size:11px}.feedback{min-height:30px;margin:11px 0 0;color:var(--muted);text-align:center;font-weight:750;line-height:1.6}.feedback.good{color:#9dffd0}.feedback.bad{color:#ffb0bd}.how{margin:8px 0 0;color:var(--muted);text-align:center;font-size:13px}.result-icon{margin:0;font-size:64px}.result-card h2{margin:8px 0;font-size:32px}.result-card p{margin:0 auto 20px;max-width:470px;color:var(--muted);line-height:1.75}.result-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}@media(max-width:680px){.app{padding:12px 12px calc(16px + var(--safe))}.brand p{display:none}.world-strip{grid-auto-columns:minmax(165px,68vw)}.selected-world{grid-template-columns:1fr;gap:10px}.difficulty-grid{grid-template-columns:1fr}.difficulty{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center}.difficulty b{grid-row:span 2}.difficulty strong{margin:0}.difficulty span{grid-column:2}.play-head{grid-template-columns:1fr auto}.progress{grid-column:1/-1;grid-row:2}.arena{min-height:min(57vh,530px);border-radius:21px}.door{width:76px;height:74px;border-radius:13px}.door .arrow{font-size:25px}.door .door-color{font-size:11px}.door.top{top:2%}.door.bottom{bottom:2%}.door.left{left:2%}.door.right{right:2%}.task-card{width:min(61vw,310px);min-height:184px;padding:18px 12px;border-radius:19px}.task-main{font-size:clamp(42px,14vw,62px)}.task-sub{margin-top:8px;font-size:13px}.stay{bottom:11px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
    /* 不動按鈕移到棋盤外，避免遮住下方的門。 */
    .arena { overflow: visible; margin-bottom: 62px; }
    .stay { bottom: -55px; }
    .stay[hidden] { display: none; }
    /* 色彩世界以前只保留方向；白門不提早暗示顏色規則。 */
    .door.plain { color: #15324e; border-color: #fff; background: linear-gradient(150deg, #fff, #dbeaf6); box-shadow: inset 0 1px rgba(255,255,255,.9), 0 10px 20px rgba(0,0,0,.25); }
    .door.plain .arrow { text-shadow: none; }
    .door.plain .door-color { display: none; }
    .door, .task-card, .feedback { transition: transform .16s ease, filter .16s ease, opacity .16s ease; }
    .world-card.achievement-unlocked { border-color: #fff19b; box-shadow: inset 0 1px rgba(255,255,255,.45), 0 0 24px rgba(255,223,83,.5), 0 9px 20px rgba(0,0,0,.22); }
    .achievement { display: inline-block; margin-left: 5px; color: #fff19b; font-style: normal; font-weight: 950; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
    /* 內部方向代碼是 up/down，位置也要對應到上下兩扇門。 */
    .door.up, .door.down { left: 50%; --move: translateX(-50%); transform: translateX(-50%); }
    .door.up { top: 4%; }
    .door.down { bottom: 4%; }
    @media (max-width: 680px) {
      .door.up { top: 2%; }
      .door.down { bottom: 2%; }
    }
  </style>

<body>
  <main class="shell" id="shell"><div class="app">
    <header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">NOT</div><div><h1>Not Not 方向挑戰</h1><p>讀懂最短指令，走對那一扇門</p></div></div><a class="home-link" href="./index.html">← 回主頁</a></header>
    <section class="screen" id="startScreen"><div class="intro"><p class="eyebrow">邏輯暖身・手指滑動</p><h2>左、非左、<br>非非左。</h2><p class="lead">開始時四周是白門，只看方向；進入色彩世界後，才要判讀門的顏色。若沒有任何門能走，就按中央下方的「無／不動」。</p><div class="logic-row"><span>左 → <strong>左門</strong></span><span>非左 → <strong>不是左</strong></span><span>無 → <strong>不動</strong></span></div><button class="primary" id="openWorlds" type="button">選擇世界開始</button></div></section>
    <section class="screen" id="worldScreen" hidden><h2 class="world-heading">選擇挑戰世界</h2><p class="world-note">世界規則會累積：後面的世界可能同時出現前面所有類型的指令。</p><div class="world-strip" id="worldStrip" aria-label="世界順序"></div><section class="selected-world" aria-live="polite"><div><h3 id="worldName"></h3><p id="worldDescription"></p></div><div class="selected-rule" id="worldRule"></div></section><section class="mode-settings" aria-label="遊玩方式"><h3>遊玩方式</h3><div class="mode-buttons"><button class="mode-button" id="practiceMode" type="button" aria-pressed="true">練習模式</button><button class="mode-button" id="gameMode" type="button" aria-pressed="false">遊戲模式</button></div><label class="speed-label">每題時間<select id="speedSelect" disabled><option value="slow">慢：5 秒</option><option value="normal" selected>中：3.5 秒</option><option value="fast">快：2.2 秒</option></select></label></section><div class="difficulty-grid" id="difficultyGrid" aria-label="三層難度"></div><p class="tip"><strong>三層統一規則：</strong>正常最多出現「非」，困難最多「非非」，超難最多「非非非」。練習模式不限時並會解釋；遊戲模式依你選的速度倒數。</p></section>
    <section class="screen" id="playScreen" hidden aria-label="遊戲畫面"><div class="play-head"><button class="secondary" id="backWorlds" type="button">← 世界選單</button><div class="progress" id="progress" aria-label="關卡進度"></div><p class="world-status" id="playingWorld"></p></div><div class="game-info"><span class="lives" id="lives" aria-live="polite"></span><span id="modeLabel"></span><div class="timer-track" id="timerTrack" hidden><span class="timer-fill" id="timerFill"></span></div></div><section class="arena" id="arena" aria-label="中央題卡上可往上、下、左、右滑動" tabindex="0"><div id="doors" aria-label="四個方向的門"></div><article class="task-card" id="taskCard"><span class="rule-mark" id="ruleMark" hidden aria-label="全部反向">⊘</span><p class="task-tag" id="taskTag"></p><p class="task-main" id="taskMain"></p><p class="task-sub" id="taskSub"></p></article><button class="stay" id="stayButton" type="button">無<small>不動</small></button></section><p class="feedback" id="feedback" aria-live="polite">滑向符合的門；沒有門能走時，按「無」。</p><p class="how">也可點門操作；練習模式可用空白鍵選「無」。</p></section>
    <section class="screen" id="endScreen" hidden aria-live="polite"><div class="result-card"><p class="result-icon" id="resultIcon">✦</p><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-actions"><button class="primary" id="retry" type="button">再玩一次</button><button class="secondary" id="chooseWorld" type="button">換一個世界</button></div></div></section>
  </div></main>
  <script>
    (() => {
      const DIRECTIONS=[{id:'up',label:'上',arrow:'↑'},{id:'right',label:'右',arrow:'→'},{id:'down',label:'下',arrow:'↓'},{id:'left',label:'左',arrow:'←'}];
      const COLORS=[{id:'red',label:'紅',hex:'#e64b59'},{id:'blue',label:'藍',hex:'#318ee9'},{id:'yellow',label:'黃',hex:'#dcae19'},{id:'green',label:'綠',hex:'#2aaf73'}];
      const D=Object.fromEntries(DIRECTIONS.map(x=>[x.id,x])), C=Object.fromEntries(COLORS.map(x=>[x.id,x])), IDS=DIRECTIONS.map(x=>x.id);
      const DIFFICULTIES=[{id:'normal',label:'正常',count:10,maxNot:1,detail:'只有「非」：左、非左'},{id:'hard',label:'困難',count:20,maxNot:2,detail:'加入「非非」'},{id:'challenge',label:'超難',count:30,maxNot:3,detail:'再加入「非非非」'},{id:'advanced',label:'進階',count:40,maxNot:3,detail:'40 題綜合挑戰'},{id:'ultimate',label:'極限',count:50,maxNot:3,detail:'50 題綜合挑戰'}];
      const SPEEDS={slow:{label:'慢：5 秒',ms:5000},normal:{label:'中：3.5 秒',ms:3500},fast:{label:'快：2.2 秒',ms:2200}};
      const WORLDS=[
        {id:'start',title:'起點世界',symbol:'✦',subtitle:'方向練習',desc:'只看上、下、左、右；先熟悉四扇門的位置。',rule:'看到方向，就走同方向的門。',a:'#175b78',b:'#986474'},
        {id:'negation',title:'否定世界',symbol:'非',subtitle:'增加「非」',desc:'開始出現最短的否定指令，例如「非左」。',rule:'非左＝不是左；可以走上、右、下。',a:'#8f354b',b:'#189cd0'},
        {id:'void',title:'虛空世界',symbol:'無',subtitle:'增加不動',desc:'五個基本指令是上、下、左、右、無；再逐層加入「非」。',rule:'無＝不動；非無＝任選一扇門。',a:'#1f1f2a',b:'#737380'},
        {id:'color',title:'色彩世界',symbol:'●',subtitle:'門有顏色',desc:'文字可以是方向、顏色或非顏色，例如紅、非紅；同色門可能不只一扇。',rule:'紅＝走所有紅門；非紅＝走不是紅的門。若沒有符合的門，等同無。',a:'#005d6a',b:'#d5df16'},
        {id:'logic',title:'邏輯世界',symbol:'∧∨',subtitle:'增加「和／或」',desc:'複合句可能是「上和紅」或「上或紅」。',rule:'和要兩個都成立；或只要其中一個成立。',a:'#44336d',b:'#6aa433'},
        {id:'colorblind',title:'色盲世界',symbol:'◉',subtitle:'文字與字色不同',desc:'字寫的顏色，可能和字本身顯示的顏色不同。',rule:'看文字內容，不看文字的字色；「紅」仍是紅門。',a:'#144c22',b:'#ad472f'},
        {id:'impossible',title:'不可能世界',symbol:'⊘',subtitle:'單題禁止標記',desc:'只有出現禁止圈的那一題不能走動；其他題卡照原本指令判讀。',rule:'看到 ⊘，那一題等同無；沒有 ⊘ 就照文字走。',a:'#665c18',b:'#ed8610'},
        {id:'shadow',title:'無影門世界',symbol:'□',subtitle:'有些門是空白',desc:'有些方向沒有門；指令指向空白門時，只能不動。',rule:'例如上但上方是空白，就按無。',a:'#181818',b:'#5f5f65'},
        {id:'continuous',title:'連續世界',symbol:'⇢',subtitle:'連續兩個指令',desc:'第一張會先寫「右然後藍」；先做右，下一張再做藍。',rule:'第一張只做前半句；下一張完成後半句。',a:'#64007e',b:'#273d81'},
        {id:'lie',title:'謊言世界',symbol:'⊘',subtitle:'全部反向思考',desc:'中央禁止圈代表所有指令都要反向解讀。',rule:'例如紅改成非紅；左改成非左。',a:'#5d102f',b:'#e33f63'}
      ];
      const E={shell:document.getElementById('shell'),start:document.getElementById('startScreen'),worlds:document.getElementById('worldScreen'),play:document.getElementById('playScreen'),end:document.getElementById('endScreen'),strip:document.getElementById('worldStrip'),worldName:document.getElementById('worldName'),worldDescription:document.getElementById('worldDescription'),worldRule:document.getElementById('worldRule'),difficulties:document.getElementById('difficultyGrid'),practice:document.getElementById('practiceMode'),gameMode:document.getElementById('gameMode'),speed:document.getElementById('speedSelect'),progress:document.getElementById('progress'),playingWorld:document.getElementById('playingWorld'),lives:document.getElementById('lives'),modeLabel:document.getElementById('modeLabel'),timerTrack:document.getElementById('timerTrack'),timerFill:document.getElementById('timerFill'),arena:document.getElementById('arena'),doors:document.getElementById('doors'),taskCard:document.getElementById('taskCard'),taskTag:document.getElementById('taskTag'),taskMain:document.getElementById('taskMain'),taskSub:document.getElementById('taskSub'),ruleMark:document.getElementById('ruleMark'),stay:document.getElementById('stayButton'),feedback:document.getElementById('feedback'),resultIcon:document.getElementById('resultIcon'),resultTitle:document.getElementById('resultTitle'),resultText:document.getElementById('resultText')};
      let selectedWorld=0, selectedMode='practice', game=null, swipeStart=null, timer=null, nextTimer=null, audioContext=null;
      const pick=a=>a[Math.floor(Math.random()*a.length)]; const shuffle=a=>{const out=[...a];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}; const non=(n,t)=>'非'.repeat(n)+t;
      function perfectKey(worldId){return`not-not-perfect-modes-${worldId}`}function perfectModes(worldId){try{const raw=JSON.parse(localStorage.getItem(perfectKey(worldId))||'[]');return[...new Set(raw.filter(id=>DIFFICULTIES.some(d=>d.id===id)))]}catch{return[]}}function hasColorAchievement(worldId){const done=perfectModes(worldId);return DIFFICULTIES.every(d=>done.includes(d.id))}function recordPerfectMode(worldId,difficultyId){const done=perfectModes(worldId);if(!done.includes(difficultyId)){done.push(difficultyId);try{localStorage.setItem(perfectKey(worldId),JSON.stringify(done))}catch{}}return hasColorAchievement(worldId)}
      function setTheme(world){E.shell.style.setProperty('--world-a',world.a);E.shell.style.setProperty('--world-b',world.b);E.shell.style.setProperty('--accent',world.id==='color'?'#e2ef22':world.id==='lie'?'#ff8ca2':'#65d7ff')}
      function clearTimer(){if(timer)clearInterval(timer);timer=null}function prepareSound(){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return null;if(!audioContext)audioContext=new Audio();if(audioContext.state==='suspended')audioContext.resume();return audioContext}function playSound(kind){const ctx=prepareSound();if(!ctx)return;const good=kind==='good',notes=good?[523.25,659.25]:[196,146.83],wave=good?'sine':'triangle',now=ctx.currentTime;notes.forEach((freq,i)=>{const start=now+i*(good ? .09 : .1),duration=good ? .16 : .18,osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=wave;osc.frequency.setValueAtTime(freq,start);gain.gain.setValueAtTime(good ? .075 : .085,start);gain.gain.exponentialRampToValueAtTime(.001,start+duration);osc.connect(gain).connect(ctx.destination);osc.start(start);osc.stop(start+duration+.025)})}function show(name){clearTimer();clearTimeout(nextTimer);['start','worlds','play','end'].forEach(k=>E[k].hidden=k!==name);window.scrollTo(0,0);E.shell.scrollTop=0}
      function renderWorlds(){const world=WORLDS[selectedWorld];setTheme(world);E.strip.innerHTML='';WORLDS.forEach((w,i)=>{const achieved=hasColorAchievement(w.id),b=document.createElement('button');b.type='button';b.className='world-card'+(achieved?' achievement-unlocked':'');b.setAttribute('aria-pressed',String(i===selectedWorld));b.style.setProperty('--card-a',w.a);b.style.setProperty('--card-b',w.b);b.innerHTML=`<i aria-hidden="true">${w.symbol}</i><strong>${w.title}</strong><small>${w.subtitle}${achieved?'<em class="achievement">🌈 色彩成就</em>':''}</small>`;b.onclick=()=>{selectedWorld=i;renderWorlds()};E.strip.append(b)});E.worldName.textContent=world.title;E.worldDescription.textContent=world.desc;E.worldRule.textContent=world.rule;E.practice.setAttribute('aria-pressed',String(selectedMode==='practice'));E.gameMode.setAttribute('aria-pressed',String(selectedMode==='game'));E.speed.disabled=selectedMode!=='game';E.difficulties.innerHTML='';DIFFICULTIES.forEach(d=>{const b=document.createElement('button');b.type='button';b.className='difficulty';b.innerHTML=`<b>${d.count}</b><strong>${d.label}</strong><span>${d.detail}</span>`;b.onclick=()=>startGame(selectedWorld,d);E.difficulties.append(b)})}
      function board(index,blank=false){const colored=index>=3,palette=colored?shuffle(COLORS).slice(0,pick([2,2,2,3,3,4])):[];const result=Object.fromEntries(DIRECTIONS.map(d=>[d.id,{direction:d.id,color:colored?pick(palette).id:null,active:true}]));if(blank)result[pick(IDS)].active=false;return result}
      function directionSpec(difficulty,min=0){return{kind:'direction',base:pick(IDS),not:Math.max(min,Math.floor(Math.random()*(difficulty.maxNot+1)))}}function colorSpec(difficulty,colorblind=false){const base=pick(COLORS),s={kind:colorblind?'colorblind':'color',base:base.id,not:Math.floor(Math.random()*(difficulty.maxNot+1))};if(colorblind)s.ink=pick(COLORS.filter(c=>c.id!==base.id)).id;return s}function logicSpec(){return{kind:'logic',direction:pick(IDS),color:pick(COLORS).id,op:pick(['and','or'])}}
      function typesAt(index){const types=['direction'];if(index>=2)types.push('void');if(index>=3)types.push('color');if(index>=4)types.push('logic');if(index>=5)types.push('colorblind');if(index>=6)types.push('impossible');if(index>=7)types.push('shadow');if(index>=9)types.push('lie');return types}
      function impossibleSpec(difficulty,index){const prior=typesAt(index-1).filter(x=>!['void','impossible','shadow','lie'].includes(x));return{...makeSpec(pick(prior),difficulty,index-1),impossible:true}}function makeSpec(type,difficulty,index,force=false){if(type==='direction')return index===0?{kind:'direction',base:pick(IDS),not:0}:directionSpec(difficulty,force&&index===1?1:0);if(type==='void')return{kind:'void',not:Math.floor(Math.random()*(difficulty.maxNot+1))};if(type==='color')return colorSpec(difficulty);if(type==='logic')return logicSpec();if(type==='colorblind')return colorSpec(difficulty,true);if(type==='impossible')return impossibleSpec(difficulty,index);if(type==='shadow')return{...directionSpec(difficulty),shadow:true};if(type==='lie'){const prior=typesAt(index-1).filter(x=>!['impossible','shadow','lie'].includes(x));return{...makeSpec(pick(prior),difficulty,index-1),lie:true}}return directionSpec(difficulty)}
      function textFor(s){if(s.kind==='void')return non(s.not||0,'無');if(s.kind==='direction')return non(s.not,D[s.base].label);if(s.kind==='color'||s.kind==='colorblind')return non(s.not,C[s.base].label);if(s.kind==='logic')return D[s.direction].label+(s.op==='or'?'或':'和')+C[s.color].label;return'無'}
      function candidates(s,b){if(s.kind==='void')return(s.not||0)%2===0?[]:IDS;if(s.kind==='direction')return s.not%2===0?[s.base]:IDS.filter(x=>x!==s.base);if(s.kind==='color'||s.kind==='colorblind'){const same=IDS.filter(d=>b[d].color===s.base);return s.not%2===0?same:IDS.filter(d=>!same.includes(d))}if(s.kind==='logic'){const byColor=IDS.filter(d=>b[d].color===s.color);return s.op==='or'?IDS.filter(d=>d===s.direction||byColor.includes(d)):(b[s.direction].color===s.color?[s.direction]:[])}return[]}
      function answerFor(s,b){let answer=candidates(s,b).filter(d=>b[d].active);if(s.impossible)answer=[];if(s.lie)answer=IDS.filter(d=>b[d].active&&!answer.includes(d));return answer}
      function voidDeck(difficulty){const deck=[];for(let not=0;not<=difficulty.maxNot;not++){IDS.forEach(base=>deck.push({kind:'direction',base,not}));deck.push({kind:'void',not})}return deck}
      function roundAt(index,difficulty,opts={}){const current=WORLDS[index].id,newType=(current==='start'||current==='negation')?'direction':current,type=opts.force||pick(typesAt(index));let s=opts.spec?{...opts.spec}:makeSpec(type,difficulty,index,opts.force===newType),b=board(index,Boolean(s.shadow));if(s.shadow){const missing=IDS.find(d=>!b[d].active);s={kind:'direction',base:missing,not:0,shadow:true}}return{board:b,spec:s,answer:answerFor(s,b),series:opts.series||null}}
      function buildRounds(index,difficulty){if(WORLDS[index].id==='void'){const rounds=[];while(rounds.length<difficulty.count)rounds.push(...shuffle(voidDeck(difficulty)).map(spec=>roundAt(index,difficulty,{spec})));return rounds.slice(0,difficulty.count)}const rounds=[],current=WORLDS[index].id,newType=(current==='start'||current==='negation')?'direction':current;if(index===8&&difficulty.count>=2){const first=roundAt(index,difficulty,{force:'direction',series:{step:1,total:2}}),second=roundAt(index,difficulty,{force:'color',series:{step:2,total:2}});first.series.next=second.spec;rounds.push(first,second)}else if(index>0){for(let i=0;i<Math.min(2,difficulty.count);i++)rounds.push(roundAt(index,difficulty,{force:newType}))}while(rounds.length<difficulty.count)rounds.push(roundAt(index,difficulty));return rounds.slice(0,difficulty.count)}
      function startGame(index,difficulty){prepareSound();const world=WORLDS[index];game={worldIndex:index,world,difficulty,rounds:buildRounds(index,difficulty),index:0,lives:3,streak:0,waiting:false,started:false,perfect:true,timeMs:SPEEDS[E.speed.value].ms};setTheme(world);show('play');renderReady();E.arena.focus({preventScroll:true});E.shell.scrollTop=0}
      function renderProgress(){const n=Math.min(12,game.difficulty.count);E.progress.innerHTML='';for(let i=0;i<n;i++){const dot=document.createElement('i');if(i<game.index)dot.classList.add('done');if(i===game.index)dot.classList.add('current');E.progress.append(dot)}if(game.difficulty.count>n){const more=document.createElement('small');more.textContent=` ${game.index+1}/${game.difficulty.count}`;E.progress.append(more)}}
      function renderReady(){clearTimer();game.waiting=false;E.playingWorld.innerHTML=`${game.world.title}<small>準備 ${game.difficulty.count} 題挑戰</small>`;E.lives.textContent='❤ 3　準備開始';E.modeLabel.textContent=selectedMode==='game'?`遊戲・${SPEEDS[E.speed.value].label}`:'練習・不限時';E.taskTag.textContent='準備';E.taskMain.textContent='↑';E.taskMain.classList.remove('ink');E.taskSub.textContent='向上滑動開始；第 1 題與倒數會在滑動後才出現。';E.ruleMark.hidden=true;E.taskCard.classList.remove('lie','impossible');E.doors.innerHTML='';E.stay.hidden=true;E.feedback.textContent='準備好了，向上滑動開始。';E.feedback.className='feedback';E.progress.innerHTML='';for(let i=0;i<Math.min(12,game.difficulty.count);i++)E.progress.append(document.createElement('i'));E.timerTrack.hidden=true}

      function renderDoors(round){E.doors.innerHTML='';DIRECTIONS.forEach(d=>{const info=round.board[d.id],b=document.createElement('button');b.type='button';b.className='door '+d.id;if(!info.active){b.disabled=true;b.classList.add('empty');b.setAttribute('aria-label',`${d.label}方是空白，沒有門`);b.innerHTML='<span class="arrow">空</span><span class="door-color">沒有門</span>'}else{const c=info.color?C[info.color]:null;if(!c)b.classList.add('plain');b.style.setProperty('--door',c?c.hex:'#e8f4ff');b.setAttribute('aria-label',c?`${d.label}門，${c.label}色`:`${d.label}門`);b.innerHTML=`<span class="arrow">${d.arrow}</span>${c?`<span class="door-color">${c.label}</span>`:''}`;b.onclick=()=>choose(d.id)}E.doors.append(b)})}
      function tag(round){const tags=[];if(round.series)tags.push(`連續 ${round.series.step}/${round.series.total}`);if(round.spec.shadow)tags.push('有空白門');if(round.spec.kind==='colorblind')tags.push('看文字，不看字色');if(round.spec.impossible)tags.push('本題不能走');if(round.spec.lie)tags.push('全部反向');return tags.length?tags.join('・'):'指令'}
      function renderRound(){clearTimer();const r=game.rounds[game.index],gameMode=selectedMode==='game',isSeriesStart=r.series?.step===1;game.waiting=false;E.playingWorld.innerHTML=`${game.world.title}<small>第 ${game.index+1} / ${game.difficulty.count} 題</small>`;E.lives.textContent=`❤ ${game.lives}　連對 ${game.streak}`;E.modeLabel.textContent=gameMode?`遊戲・${SPEEDS[E.speed.value].label}`:'練習・不限時';E.taskTag.textContent=tag(r);E.taskMain.textContent=isSeriesStart?textFor(r.spec)+'然後'+textFor(r.series.next):textFor(r.spec);E.taskMain.classList.toggle('ink',r.spec.kind==='colorblind');E.taskMain.style.setProperty('--ink-color',r.spec.kind==='colorblind'?C[r.spec.ink].hex:'#eff8ff');E.taskSub.textContent=isSeriesStart?'這一題先做前半句；下一題再做後半句。':r.series?.step===2?'接著完成前一題的後半句。':r.spec.lie?'⊘ 看到的意思都要反過來':r.spec.impossible?'⊘ 只有這一題不能走，等同無':r.spec.kind==='logic'?(r.spec.op==='or'?'方向或顏色有一個成立即可':'方向和顏色要同時成立'):gameMode?'需要不動時，請等倒數結束。':'沒有可走的門時，按無';E.ruleMark.hidden=!r.spec.lie&&!r.spec.impossible;E.ruleMark.setAttribute('aria-label',r.spec.lie?'全部反向':'這題不能走動');E.taskCard.classList.toggle('lie',Boolean(r.spec.lie));E.taskCard.classList.toggle('impossible',Boolean(r.spec.impossible));E.stay.hidden=gameMode;E.feedback.textContent=gameMode?'滑向符合的門；需要不動時，請等待。':'滑向符合的門；沒有門能走時，按「無」。';E.feedback.className='feedback';renderDoors(r);renderProgress();E.timerTrack.hidden=!gameMode;if(gameMode)startTimer()}
      function startTimer(){const start=performance.now();E.timerFill.style.width='100%';timer=setInterval(()=>{if(!game||game.waiting)return;const ratio=Math.max(0,1-(performance.now()-start)/game.timeMs);E.timerFill.style.width=`${ratio*100}%`;if(ratio<=0){clearTimer();const r=game.rounds[game.index];resolve(r.answer.length===0,r,'時間到：')}},65)}
      function expected(r){if(!r.answer.length){if(r.spec.impossible)return selectedMode==='game'?'這題有禁止圈，等同無，要不動到倒數結束。':'這題有禁止圈，等同無，要按「無」。';return selectedMode==='game'?'這題沒有符合的門，所以要不動到倒數結束。':'這題沒有符合的門，所以要按「無」。'}return`這題可走：${r.answer.map(d=>D[d].label).join('、')}。`}function pulse(type){E.arena.classList.remove('good','bad');requestAnimationFrame(()=>E.arena.classList.add(type))}

      function resolve(correct,round,prefix){if(!game||game.waiting||!game.started)return;clearTimer();game.waiting=true;if(!correct){playSound('bad');game.perfect=false;game.lives--;game.streak=0;pulse('bad');const r=round||game.rounds[game.index];E.feedback.textContent=prefix+expected(r);E.feedback.className='feedback bad';E.lives.textContent=`❤ ${game.lives}　連對 0`;if(game.lives<=0)nextTimer=setTimeout(()=>endGame(false),1200);else nextTimer=setTimeout(renderRound,selectedMode==='practice'?1250:760);return}playSound('good');game.streak++;pulse('good');E.feedback.textContent=selectedMode==='practice'?'正確！'+expected(round):'正確！';E.feedback.className='feedback good';nextTimer=setTimeout(()=>{game.index++;game.waiting=false;if(game.index>=game.difficulty.count)endGame(true);else renderRound()},selectedMode==='practice'?620:360)}
      function endGame(won){const completed=won?game.difficulty.count:game.index,key=`not-not-best-${game.world.id}-${game.difficulty.id}`;let saved=0;try{saved=Number(localStorage.getItem(key)||0)}catch{}const old=Number.isFinite(saved)?Math.min(Math.max(0,saved),game.difficulty.count):0,best=Math.max(old,completed);if(best>old)try{localStorage.setItem(key,String(best))}catch{}const colorAchievement=won&&game.perfect&&recordPerfectMode(game.world.id,game.difficulty.id);E.resultIcon.textContent=colorAchievement?'🌈':won?'✦':'↻';E.resultTitle.textContent=colorAchievement?'色彩成就解鎖！':won?'這個世界完成了！':'先停一下，再判讀一次';E.resultText.textContent=colorAchievement?`你在 ${game.world.title}的五種模式都零失誤完成，獲得色彩成就！`:won?`你完成 ${game.world.title}的 ${game.difficulty.label}挑戰，共 ${completed} 題。本模式最高完成紀錄：${best} 題。`:`這次完成 ${completed} / ${game.difficulty.count} 題。先找出文字要的條件，再看四周是否真的有符合的門。`;show('end')}
      function swipe(dx,dy){if(Math.max(Math.abs(dx),Math.abs(dy))<28)return null;return Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}
      E.arena.addEventListener('pointerdown',e=>{if(e.target.closest('.door')||e.target.closest('.stay')||!game||game.waiting)return;swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId};E.arena.setPointerCapture?.(e.pointerId)});E.arena.addEventListener('pointerup',e=>{if(!swipeStart||swipeStart.id!==e.pointerId)return;const d=swipe(e.clientX-swipeStart.x,e.clientY-swipeStart.y);swipeStart=null;if(!game.started){if(d==='up')beginGame();else{E.feedback.textContent='請向上滑動，開始第 1 題。';E.feedback.className='feedback'}return}if(d)choose(d);else{E.feedback.textContent=selectedMode==='game'?'要不動時，請停到倒數結束。':'再滑長一點，或直接點一扇門；不動請按「無」。';E.feedback.className='feedback'}});E.arena.addEventListener('pointercancel',()=>swipeStart=null);E.arena.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowRight:'right',ArrowDown:'down',ArrowLeft:'left'};if(map[e.key]){e.preventDefault();if(!game?.started){if(map[e.key]==='up')beginGame();else{E.feedback.textContent='請按向上鍵，開始第 1 題。';E.feedback.className='feedback'}return}choose(map[e.key])}if((e.key===' '||e.key==='Enter')&&selectedMode==='practice'&&game?.started){e.preventDefault();choose(null)}});E.stay.onclick=()=>{if(selectedMode==='practice'&&game?.started)choose(null)};
